name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # the test suite compares decoded values against the output of the
      # system infocmp, and walks the terminal database it was built from
      - name: Install ncurses
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ncurses-bin ncurses-term
          infocmp -V

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "the following files are not gofmt'd:"
            gofmt -l .
            gofmt -d .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...
